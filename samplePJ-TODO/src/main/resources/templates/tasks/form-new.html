<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>新規タスク作成</title>
<link href="http://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>新規タスク作成</h2>
        <form th:action="@{/tasks}" th:object="${task}" method="post">
            
            <!-- タイトル -->
            <div class="mb-3">
                <label for="title" class="form-label">タイトル</label>
                <input type="text" class="form-control" id="title" th:field="*{title}" required>
            </div>
            
            <!-- 内容 -->
            <div class="mb-3">
                <label for="content" class="form-label">内容</label>
                <textarea class="form-control" id="content" th:field="*{content}"></textarea>
            </div>
            
            <!-- 登録者名（画面に表示・編集可能） -->
            <div class="mb-3">
                <label for="name" class="form-label">登録者</label>
                <input type="text" class="form-control" id="name" th:field="*{name}">
            </div>
            
            <!-- ログインユーザー名（DB保存用・画面には非表示） -->
            <input type="hidden" th:field="*{username}">
            
            <!-- 開始日 -->
            <div class="mb-3">
                <label for="startDate" class="form-label">開始日</label>
                <input type="date" class="form-control" id="startDate" th:field="*{startDate}">
            </div>
            
            <!-- 終了日 -->
            <div class="mb-3">
                <label for="endDate" class="form-label">終了日</label>
                <input type="date" class="form-control" id="endDate" th:field="*{endDate}">
            </div>
            
            <!-- ボタン -->
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/tasks" class="btn btn-secondary">← キャンセル</a>
        </form>
    </div>
</body>
</html>
